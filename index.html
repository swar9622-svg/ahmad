<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تحويل رصد الدرجات</title>
    <!-- استيراد مكتبة SheetJS لقراءة وتعديل ملفات الإكسل -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 50px;
            text-align: center;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: auto;
        }
        h2 { color: #2c3e50; }
        input[type="file"] {
            margin: 20px 0;
            padding: 10px;
            border: 2px dashed #3498db;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            box-sizing: border-box;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            display: none;
            margin-top: 15px;
        }
        button:hover { background-color: #219653; }
        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #e67e22;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>تحويل درجات ملف الإكسل</h2>
    <p>اختر ملف إكسل الخاص بالمسابقة لمعالجة الورقة الثانية وتصدير الجدول الجديد:</p>
    
    <input type="file" id="excelFile" accept=".xlsx, .xls" />
    <div id="status"></div>
    <br>
    <button id="downloadBtn" onclick="downloadExcel()">تحميل الملف الجديد (Excel)</button>
</div>

<script>
let newWorkbookData = null;

// دالة تحويل الدرجة بناءً على المدى الجديد
function convertGrade(val) {
    let score = parseFloat(val);
    if (isNaN(score)) return "";
    if (score <= 1) return 1;
    if (score >= 26) return 8;
    
    // معادلة خطية أو التوزيع المباشر المتفق عليه
    if (score >= 2 && score <= 5) return 2;
    if (score >= 6 && score <= 9) return 3;
    if (score >= 10 && score <= 13) return 4;
    if (score >= 14 && score <= 17) return 5;
    if (score >= 18 && score <= 21) return 6;
    if (score >= 22 && score <= 25) return 7;
    return 8;
}

document.getElementById('excelFile').addEventListener('change', function(e) {
    let file = e.target.files[0];
    if (!file) return;

    let reader = new FileReader();
    reader.onload = function(e) {
        try {
            let data = new Uint8Array(e.target.result);
            let workbook = XLSX.read(data, {type: 'array'});

            // التأكد من وجود ورقتين على الأقل
            if (workbook.SheetNames.length < 2) {
                alert('الملف يجب أن يحتوي على ورقتين على الأقل!');
                return;
            }

            // أخذ اسم الورقة الثانية
            let secondSheetName = workbook.SheetNames[1];
            let worksheet = workbook.Sheets[secondSheetName];

            // تحويل الورقة إلى مصفوفة بيانات
            let jsonData = XLSX.utils.sheet_to_json(worksheet, {header: 1});

            // بناء الجدول الجديد: عمودين (اسم الطالب A، الدرجة الجديدة B)
            let newRows = [["اسم الطالب", "الدرجة الجديدة"]];

            for (let i = 0; i < jsonData.length; i++) {
                let row = jsonData[i];
                let studentName = row[0]; // العمود A (اسم الطالب)
                let originalGrade = row[3]; // العمود D (الدرجة قبل المعادلة - الفهرس 3)

                if (studentName !== undefined && studentName !== "") {
                    let converted = convertGrade(originalGrade);
                    newRows.push([studentName, converted]);
                }
            }

            // إنتاج ملف إكسل جديد بالورقة المطلوبة فقط
            let newWs = XLSX.utils.aoa_to_sheet(newRows);
            let newWb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(newWb, newWs, "الدرجات المحولة");

            newWorkbookData = newWb;
            
            document.getElementById('status').innerText = "تمت معالجة البيانات بنجاح وجاهزة للتحميل!";
            document.getElementById('downloadBtn').style.display = 'inline-block';

        } catch (error) {
            console.error(error);
            alert('حدث خطأ أثناء قراءة الملف. تأكد من تطابق الأعمدة المطلوبة.');
        }
    };
    reader.readAsArrayBuffer(file);
});

function downloadExcel() {
    if (newWorkbookData) {
        XLSX.writeFile(newWorkbookData, "الدرجات_المحولة_الجديدة.xlsx");
    }
}
</script>

</body>
</html>
