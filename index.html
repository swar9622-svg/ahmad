<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة الغياب المدرسي الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --grad-blue: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --grad-red: linear-gradient(135deg, #c53030 0%, #e53e3e 100%);
            --grad-green: linear-gradient(135deg, #047857 0%, #10b981 100%);
            --grad-purple: linear-gradient(135deg, #5b21b6 0%, #7c3aed 100%);
            --grad-orange: linear-gradient(135deg, #c2410c 0%, #ea580c 100%);
            --bg-color: #f1f5f9;
            --text-main: #0f172a;
        }

        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            background: var(--bg-color);
            margin: 0;
            padding: 12px;
            color: var(--text-main);
            min-height: 100vh;
        }

        .app-container {
            max-width: 600px;
            margin: auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            border-top: 6px solid #1e3c72;
        }

        .school-header-card {
            background: var(--grad-blue);
            color: white;
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.15);
        }

        .school-title {
            font-size: 15px;
            font-weight: 700;
        }

        h2 {
            text-align: center;
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 15px;
            color: #1e3c72;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .dash-btn {
            border: none;
            color: white;
            padding: 12px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }

        .dash-btn:active { transform: scale(0.96); }
        .btn-school { background: var(--grad-blue); grid-column: span 2; }
        .btn-files { background: var(--grad-purple); }
        .btn-msg { background: var(--grad-orange); }
        .btn-pdf { background: var(--grad-red); grid-column: span 2; }

        .full-action-btn {
            background: var(--grad-green);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            font-size: 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.25);
            margin-bottom: 15px;
            transition: transform 0.2s;
        }
        .full-action-btn:active { transform: scale(0.98); }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }

        .modal-card {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            box-sizing: border-box;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 800;
            color: #1e3c72;
        }

        .close-btn {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            width: 28px; height: 28px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 12px;
            color: #475569;
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            font-size: 13px;
            box-sizing: border-box;
            background: #f8fafc;
        }

        .form-control:focus {
            outline: none;
            border-color: #2563eb;
            background: #fff;
        }

        /* بطاقة الطالب بخلفية متدرجة خفيفة */
        .student-card {
            background: linear-gradient(135deg, #f8fafc 0%, #edf2f7 100%);
            border: 1px solid #e2e8f0;
            border-right: 6px solid #dc2626;
            padding: 12px 15px;
            margin-top: 10px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.03);
            transition: all 0.3s ease;
        }

        /* تنسيق خاص للبطاقة التي تم إرسال رسالة لها */
        .student-card.sent {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%) !important;
            border-right-color: #10b981 !important;
            border-color: #bbf7d0 !important;
        }

        .student-name {
            font-weight: 800;
            color: #1e3c72;
            font-size: 15px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .student-info {
            font-size: 12px;
            color: #475569;
            margin: 2px 0;
            font-weight: 600;
        }

        .wa-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #25d366;
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            margin-top: 8px;
            box-shadow: 0 3px 8px rgba(37, 211, 102, 0.25);
        }

        .sent-badge {
            background: #dcfce7;
            color: #166534;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .error-box {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
            font-weight: 700;
        }

        .status-pill {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            margin-top: 5px;
            display: inline-block;
            font-weight: 700;
        }
        .pill-saved { background: #dcfce7; color: #166534; }
        .pill-missing { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="school-header-card">
        <div>
            <div style="font-size: 10px; opacity: 0.8;">اسم المدرسة المعتمد:</div>
            <div id="displaySchoolName" class="school-title">متوسطة علي بن أبي طالب</div>
        </div>
        <div style="font-size: 20px;">🏫</div>
    </div>

    <h2>نظام متابعة الغياب الذكي</h2>

    <div class="dashboard-grid">
        <button class="dash-btn btn-school" onclick="playSound(); openModal('schoolModal')">
            <span>🏫 تعديل وحفظ اسم المدرسة</span>
        </button>
        <button class="dash-btn btn-files" onclick="playSound(); openModal('filesModal')">
            <span>📁 إرفاق وإدارة الملفات</span>
        </button>
        <button class="dash-btn btn-msg" onclick="playSound(); openModal('msgModal')">
            <span>✏️ تخصيص نص الرسالة</span>
        </button>
        <button class="dash-btn btn-pdf" onclick="playSound(); openModal('pdfModal')">
            <span>🖨️ طباعة كشف الغياب PDF</span>
        </button>
    </div>

    <button class="full-action-btn" onclick="playSound(); processFiles()">⚡ استخراج الغائبين وتجهيز الرسائل</button>

    <div id="results"></div>
</div>

<div id="schoolModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <div class="modal-title">إعدادات المدرسة</div>
            <button class="close-btn" onclick="playSound(); closeModal('schoolModal')">✕</button>
        </div>
        <div class="form-group">
            <label>أدخل اسم المدرسة:</label>
            <input type="text" id="inputSchoolName" class="form-control" value="متوسطة علي بن أبي طالب">
        </div>
        <button class="full-action-btn" style="margin:0;" onclick="playSound(); saveSchoolName()">💾 حفظ اسم المدرسة</button>
    </div>
</div>

<div id="filesModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <div class="modal-title">إرفاق الملفات</div>
            <button class="close-btn" onclick="playSound(); closeModal('filesModal')">✕</button>
        </div>
        <div class="form-group">
            <label>📁 1. ملف إحصائية الغياب (يتم إرفاقه يومياً):</label>
            <input type="file" id="file1" class="form-control" accept=".xlsx, .xls" onchange="updateFileLabel('file1', 's1')">
            <div id="s1" style="font-size:11px; color:#10b981; margin-top:3px; font-weight:700;"></div>
        </div>
        <div class="form-group">
            <label>📁 2. ملف بيانات الإرشاد والجوالات (يُحفظ تلقائياً بالجهاز):</label>
            <input type="file" id="file2" class="form-control" accept=".xlsx, .xls" onchange="saveGuidanceFile(this)">
            <div id="guidanceStatus" style="margin-top: 5px;"></div>
        </div>
        <button class="full-action-btn" style="margin:0;" onclick="playSound(); closeModal('filesModal')">✔️ إغلاق واعتماد الملفات</button>
    </div>
</div>

<div id="msgModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <div class="modal-title">تخصيص الرسالة والتاريخ</div>
            <button class="close-btn" onclick="playSound(); closeModal('msgModal')">✕</button>
        </div>
        <div class="form-group">
            <label>📅 تاريخ الغياب:</label>
            <input type="date" id="absenceDate" class="form-control">
        </div>
        <div class="form-group">
            <label>✏️ نص رسالة الواتساب:</label>
            <textarea id="msgTemplate" class="form-control" style="height:90px;">السلام عليكم ولي أمر الطالب (اسم الطالب)، نود إفادتكم بتغيب ابنكم عن المدرسة ليوم (التاريخ)، ونتمنى حضور واهتمام الجميع. شكراً لكم.</textarea>
        </div>
        <button class="full-action-btn" style="margin:0;" onclick="playSound(); closeModal('msgModal')">💾 حفظ الإعدادات</button>
    </div>
</div>

<div id="pdfModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <div class="modal-title">طباعة وتصدير كشف الغياب PDF</div>
            <button class="close-btn" onclick="playSound(); closeModal('pdfModal')">✕</button>
        </div>
        <div class="form-group">
            <label>اختر نطاق الطباعة:</label>
            <select id="pdfScope" class="form-control">
                <option value="all">جميع المراحل والفصول الغائبة</option>
                <option value="first_int">الأول المتوسط فقط</option>
                <option value="sec_int">الثاني المتوسط فقط</option>
            </select>
        </div>
        <button class="full-action-btn" style="background:var(--grad-red); margin:0;" onclick="playSound(); generatePDFReport()">🖨️ طباعة وتحميل الكشف PDF</button>
    </div>
</div>

<script>
    // نظام الأصوات التفاعلية (زر النقر)
    function playSound() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(580, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.08);
        } catch (e) {
            // تجاهل الخطأ في حال لم يدعم المتصفح الصوت التلقائي
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('absenceDate').value = today;
        checkStoredGuidanceData();
    });

    function openModal(modalId) { document.getElementById(modalId).style.display = 'flex'; }
    function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }

    function saveSchoolName() {
        const name = document.getElementById('inputSchoolName').value.trim();
        if (name) {
            document.getElementById('displaySchoolName').innerText = name;
            closeModal('schoolModal');
            alert('تم حفظ اسم المدرسة بنجاح!');
        }
    }

    function updateFileLabel(inputId, statusId) {
        const file = document.getElementById(inputId).files[0];
        if (file) { document.getElementById(statusId).innerText = `✅ تم اختيار: ${file.name}`; }
    }

    // حفظ ملف الإرشاد في الذاكرة المحلية للجهاز ليظل مخزناً دائماً
    let cachedJson2 = null;

    function checkStoredGuidanceData() {
        const savedData = localStorage.getItem('guidance_excel_data');
        const savedFileName = localStorage.getItem('guidance_file_name');
        const statusDiv = document.getElementById('guidanceStatus');
        
        if (savedData) {
            try {
                cachedJson2 = JSON.parse(savedData);
                statusDiv.innerHTML = `<span class="status-pill pill-saved">✅ ملف الإرشاد محفوظ (${savedFileName || 'الملف السابق'})</span>`;
            } catch (e) {
                localStorage.removeItem('guidance_excel_data');
            }
        } else {
            statusDiv.innerHTML = `<span class="status-pill pill-missing">⚠️ لم يتم حفظ ملف الإرشاد بعد (الرجاء إرفاقه مرة واحدة)</span>`;
        }
    }

    async function saveGuidanceFile(input) {
        const file = input.files[0];
        if (!file) return;

        try {
            document.getElementById('guidanceStatus').innerHTML = `<span class="status-pill" style="background:#e0f2fe; color:#0369a1;">⏳ جاري قراءة وحفظ ملف الإرشاد...</span>`;
            const data2 = await readExcel(file);
            const targetSheetName2 = data2.SheetNames.includes('Sheet2') ? 'Sheet2' : data2.SheetNames[0];
            const sheet2 = data2.Sheets[targetSheetName2];
            const json2 = XLSX.utils.sheet_to_json(sheet2);

            cachedJson2 = json2;
            localStorage.setItem('guidance_excel_data', JSON.stringify(json2));
            localStorage.setItem('guidance_file_name', file.name);

            checkStoredGuidanceData();
            alert('تم حفظ بيانات الإرشاد والجوالات بنجاح في جهازك ولن تحتاج لإرفاقها مرة أخرى!');
        } catch (err) {
            alert('حدث خطأ أثناء قراءة ملف الإرشاد: ' + err.message);
            checkStoredGuidanceData();
        }
    }

    let globalAbsentList = [];

    async function processFiles() {
        const f1Input = document.getElementById('file1').files[0];
        const absenceDate = document.getElementById('absenceDate').value;
        const customTemplate = document.getElementById('msgTemplate').value;
        const resultsDiv = document.getElementById('results');

        if (!f1Input) {
            alert('الرجاء إرفاق ملف إحصائية الغياب الخاص اليوم!');
            openModal('filesModal');
            return;
        }

        if (!cachedJson2) {
            alert('الرجاء إرفاق ملف بيانات الإرشاد والجوالات (لأول مرة فقط) من زر الإعدادات!');
            openModal('filesModal');
            return;
        }

        resultsDiv.innerHTML = '<p style="text-align:center; color:#475569; margin-top:15px; font-weight:700;">جاري مطابقة أسماء الطلاب وأرقام الهواتف بدقة...</p>';

        try {
            const data1 = await readExcel(f1Input);
            const sheet1 = data1.Sheets[data1.SheetNames[0]];
            const json1 = XLSX.utils.sheet_to_json(sheet1, { range: 8 });

            globalAbsentList = [];
            json1.forEach(row => {
                let nameKeys = Object.keys(row).filter(k => k.includes('الاســـم') || k.includes('الاسم') || k.includes('طالب'));
                let absenceKeys = Object.keys(row).filter(k => k.includes('غياب بدون عذر') || k.includes('بدون عذر'));

                let name = '';
                for (let k of nameKeys) {
                    if (row[k]) { name = String(row[k]).trim(); break; }
                }

                let absenceVal = 0;
                for (let k of absenceKeys) {
                    let val = parseInt(row[k]);
                    if (!isNaN(val)) { absenceVal = val; break; }
                }
                
                if (name && absenceVal > 0) {
                    let foundPhone = '';
                    
                    for (let s of cachedJson2) {
                        let sValues = Object.values(s).map(v => String(v).trim());
                        let matchName = sValues.some(val => val.includes(name) || name.includes(val));
                        
                        if (matchName) {
                            for (let val of sValues) {
                                let cleanVal = val.replace(/[^0-9]/g, '');
                                if (cleanVal.length >= 9 && (cleanVal.startsWith('05') || cleanVal.startsWith('9665') || cleanVal.length === 10)) {
                                    foundPhone = cleanVal;
                                    break;
                                }
                            }
                            if (foundPhone) break;
                        }
                    }

                    if (foundPhone) {
                        if (foundPhone.startsWith('05')) {
                            foundPhone = '966' + foundPhone.substring(1);
                        } else if (foundPhone.length === 9 && foundPhone.startsWith('5')) {
                            foundPhone = '966' + foundPhone;
                        }
                    }

                    globalAbsentList.push({
                        name: name,
                        grade: row['الصف'] || row['المرحلة'] || '',
                        section: row['الفصل'] || row['الشعبة'] || '',
                        phone: foundPhone,
                        id: 'student_' + Math.random().toString(36).substr(2, 9)
                    });
                }
            });

            if (globalAbsentList.length === 0) {
                resultsDiv.innerHTML = '<div class="error-box">لم يتم العثور على طلاب غائبين (غياب بدون عذر > 0) في هذا الملف.</div>';
                return;
            }

            renderAbsentList(resultsDiv, customTemplate, absenceDate);

        } catch (error) {
            console.error(error);
            resultsDiv.innerHTML = `<div class="error-box">حدث خطأ أثناء معالجة الملف:<br>${error.message}</div>`;
        }
    }

    function renderAbsentList(container, customTemplate, absenceDate) {
        let html = `<div style="font-weight:800; color:#1e3c72; font-size:16px; margin-top:20px; border-bottom:2px solid #e2e8f0; padding-bottom:6px;">📊 قائمة الطلاب الغائبين (${globalAbsentList.length}):</div>`;
        
        globalAbsentList.forEach((student, index) => {
            let msg = customTemplate
                .replace(/\(اسم الطالب\)/g, student.name)
                .replace(/\(التاريخ\)/g, absenceDate);

            let encodedMsg = encodeURIComponent(msg);
            let waLink = student.phone ? `https://wa.me/${student.phone}?text=${encodedMsg}` : `#`;

            html += `
                <div class="student-card" id="card_${index}">
                    <div class="student-name">
                        <span>${index + 1}. ${student.name}</span>
                        <span id="badge_${index}" style="display:none;" class="sent-badge">✅ تم الإرسال</span>
                    </div>
                    <div class="student-info">📁 الصف: ${student.grade} | الفصل: ${student.section}</div>
                    <div class="student-info">📞 جوال ولي الأمر: ${student.phone ? '0' + student.phone.substring(3) : 'غير متوفر'}</div>
                    ${student.phone ? `<a href="${waLink}" target="_blank" class="wa-btn" onclick="markAsSent(${index})">💬 إرسال واتساب</a>` : '<span style="color:#dc2626; font-size:11px; font-weight:700;">⚠️ رقم الجوال غير متاح</span>'}
                </div>
            `;
        });

        container.innerHTML = html;
    }

    // دالة تمييز الطالب بعد إرسال الرسالة
    function markAsSent(index) {
        playSound();
        setTimeout(() => {
            const card = document.getElementById(`card_${index}`);
            const badge = document.getElementById(`badge_${index}`);
            if (card) {
                card.classList.add('sent');
            }
            if (badge) {
                badge.style.display = 'inline-flex';
            }
        }, 500);
    }

    function generatePDFReport() {
        if (globalAbsentList.length === 0) {
            alert('الرجاء استخراج الغائبين أولاً قبل طباعة الكشف!');
            closeModal('pdfModal');
            return;
        }

        const schoolName = document.getElementById('displaySchoolName').innerText;
        const absenceDate = document.getElementById('absenceDate').value;
        const scope = document.getElementById('pdfScope').value;

        let filteredList = globalAbsentList;
        if (scope === 'first_int') {
            filteredList = globalAbsentList.filter(s => s.grade.includes('الأول'));
        } else if (scope === 'sec_int') {
            filteredList = globalAbsentList.filter(s => s.grade.includes('الثاني'));
        }

        let printWindow = document.createElement('div');
        printWindow.style.padding = '20px';
        printWindow.style.fontFamily = 'IBM Plex Sans Arabic, sans-serif';
        printWindow.innerHTML = `

    function readExcel(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    resolve(workbook);
                } catch (err) { reject(err); }
            };
            reader.onerror = (err) => reject(err);
            reader.readAsArrayBuffer(file);
        });
    }
