<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الانضمام إلى صف الثاني المتوسط - MyU</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 50px;
            color: #333;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }
        .btn {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>الانضمام لصف الثاني المتوسط</h2>
        <p>جاري فتح تطبيق MyU والانتقال إلى الصف...</p>
        <a id="myuLink" href="https://app.myu.co/class/1370232/QYC54R" class="btn">فتح في تطبيق MyU</a>
    </div>

    <script>
        window.onload = function() {
            var classUrl = "https://app.myu.co/class/1370232/QYC54R";
            // روابط المتاجر (يمكنك استبدالها برابط التطبيق الرسمي في المتجر إن وجد)
            var storeUrl = "https://play.google.com/store/apps/details?id=co.myu.app"; 

            // محاولة فتح الرابط الأصلي
            window.location.href = classUrl;

            // إذا لم يتم مغادرة الصفحة خلال 2.5 ثانية، فهذا يعني أن التطبيق غير مثبت أو لم يستجب، فيتم توجيهه للمتجر
            setTimeout(function() {
                window.location.href = storeUrl;
            }, 2500);
        };
    </script>
</body>
</html>
