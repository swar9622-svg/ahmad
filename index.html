<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل درجات المسابقة</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #1e293b; font-size: 18px; margin-bottom: 15px; }
        .upload-btn {
            background-color: #3b82f6;
            color: white;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            display: block;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 15px;
        }
        input[type="file"] { display: none; }
        #status {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #d97706;
            word-break: break-word;
        }
        button#downloadBtn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            display: none;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>تحويل درجات الإكسل</h2>
    
    <label class="upload-btn" for="excelFile">
        📁 اختيار ملف الإكسل
    </label>
    <input type="file" id="excelFile" accept=".xlsx, .xls" />
    
    <div id="status">الرجاء اختيار ملف الإكسل البدء...</div>
    
    <button id="downloadBtn" onclick="downloadExcel()">تحميل الملف المحول 📥</button>
</div>

<script>
let newWorkbookData = null;

function convertGrade(val) {
    let score = parseFloat(val);
    if (isNaN(score)) return "";
    
    // شرط الدرجة 30 تصبح 10
    if (score === 30) return 10;
    
    if (score <= 1) return 1;
    if (score >= 26 && score < 30) return 8;
    
    if (score >= 2 && score <= 5) return 2;
    if (score >= 6 && score <= 9) return 3;
    if (score >= 10 && score <= 13) return 4;
    if (score >= 14 && score <= 17) return 5;
    if (score >= 18 && score <= 21) return 6;
    if (score >= 22 && score <= 25) return 7;
    
    return score;
}

document.getElementById('excelFile').addEventListener('change', function(e) {
    let file = e.target.files[0];
    if (!file) return;

    let statusDiv = document.getElementById('status');
    statusDiv.style.color = "#d97706";
    statusDiv.innerText = "جاري قراءة الملف...";

    let reader = new FileReader();
    reader.onload = function(e) {
        try {
            let data = new Uint8Array(e.target.result);
            let workbook = XLSX.read(data, {type: 'array'});

            if (!workbook.SheetNames || workbook.SheetNames.length < 2) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = "خطأ: الملف لا يحتوي على ورقتين!";
                return;
            }

            // قراءة الورقة الثانية
            let secondSheetName = workbook.SheetNames[1];
            let worksheet = workbook.Sheets[secondSheetName];
            let jsonData = XLSX.utils.sheet_to_json(worksheet, {header: 1});

            let newRows = [["اسم الطالب", "الدرجة الجديدة"]];
            let count = 0;

            for (let i = 0; i < jsonData.length; i++) {
                let row = jsonData[i];
                if (!row || row.length === 0) continue;

                let studentName = row[0]; // العمود الأول A (الاسم)
                let originalGrade = row[3]; // العمود الرابع D (الدرجة)

                // تخطي صفوف العناوين الفارغة أو التي لا تحتوي على اسم طالب حقيقي
                if (studentName !== undefined && studentName !== null && String(studentName).trim() !== "") {
                    // تحقق إضافي لتجنب أخذ صف العناوين الرئيسي إذا وجد
                    if (String(studentName).includes("الاسم")) continue;

                    let converted = convertGrade(originalGrade);
                    newRows.push([studentName, converted]);
                    count++;
                }
            }

            if (count === 0) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = "تنبيه: لم يتم العثور على بيانات طلاب في الأعمدة المحددة.";
                return;
            }

            let newWs = XLSX.utils.aoa_to_sheet(newRows);
            let newWb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(newWb, newWs, "الدرجات المحولة");

            newWorkbookData = newWb;
            
            statusDiv.style.color = "#10b981";
            statusDiv.innerText = `✅ تمت المعالجة بنجاح (${count} طالب)!`;
            document.getElementById('downloadBtn').style.display = 'block';

        } catch (error) {
            console.error(error);
            statusDiv.style.color = "#ef4444";
            statusDiv.innerText = "حدث خطأ أثناء تحليل الملف. تأكد أنه ملف إكسل صالح.";
        }
    };
    reader.readAsArrayBuffer(file);
});

function downloadExcel() {
    if (newWorkbookData) {
        XLSX.writeFile(newWorkbookData, "الدرجات_المحولة_النهائية.xlsx");
    }
}
</script>

</body>
</html>
