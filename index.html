<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الانضمام إلى صف الثاني المتوسط - MyU</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 40px 20px;
            color: #333;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 14px 0;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
            box-sizing: border-box;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn-store {
            background-color: #28a745;
            margin-top: 10px;
        }
        .btn-store:hover {
            background-color: #218838;
        }
        .note {
            margin-top: 20px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>الانضمام لصف الثاني المتوسط</h2>
        <p>انقر على الزر أدناه للانضمام إلى الفصل مباشرة عبر تطبيق MyU:</p>
        
        <!-- زر فتح التطبيق / الرابط -->
        <a href="https://app.myu.co/class/1370232/QYC54R" class="btn">فتح في تطبيق MyU</a>
        
        <!-- زر الاحتياط للمتجر في حال لم يكن التطبيق مثبتاً -->
        <a href="https://play.google.com/store/apps/details?id=co.myu.app" class="btn btn-store">تحميل التطبيق (إذا لم يكن مثبتًا)</a>

        <div class="note">
            إذا واجهتك مشكلة، تأكد من فتح الرابط من خارج متصفح الواتساب (استخدم متصفح سفاري أو كروم).
        </div>
    </div>
</body>
</html>
